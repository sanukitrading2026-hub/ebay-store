name: Update store items

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: update-store
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch listings and build SEO pages
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: node scripts/fetch-ebay.mjs

      - name: Commit changes
        run: |
          git config user.name  "store-bot"
          git config user.email "store-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update store items and SEO pages"
            git push
            echo "pushed"
          else
            echo "no change"
          fi
