name: Update store items

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-store
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch listings and build SEO pages
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: node scripts/fetch-ebay.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install --quiet pillow numpy

      - name: Generate product videos
        run: python scripts/make_videos.py

      - name: Commit changes
        run: |
          git config user.name  "store-bot"
          git config user.email "store-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "Auto-update items, SEO, feeds and videos"
          # push safely even if the branch moved while this long job was running
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed"; exit 0
            fi
            echo "push retry $i ..."; sleep 5
          done
          echo "push failed after retries"; exit 1
