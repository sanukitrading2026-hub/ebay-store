name: Update note articles

on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-note
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch latest note articles
        run: node scripts/fetch-note.mjs

      - name: Commit changes
        run: |
          git config user.name  "store-bot"
          git config user.email "store-bot@users.noreply.github.com"
          git add notes.json
          if git diff --cached --quiet; then
            echo "no change"; exit 0
          fi
          git commit -m "Update note articles"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push; then
              echo "pushed"; exit 0
            fi
            echo "push retry $i ..."; sleep 5
          done
          echo "push failed after retries"; exit 1
